<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img">
  <rect width="900" height="500" fill="#EFE6D9"/>

  <!-- Manzanas -->
  <g fill="#E3D7C6">
    <rect x="40" y="40" width="220" height="150" rx="6"/>
    <rect x="300" y="40" width="260" height="150" rx="6"/>
    <rect x="600" y="40" width="260" height="150" rx="6"/>
    <rect x="40" y="310" width="220" height="150" rx="6"/>
    <rect x="300" y="310" width="260" height="150" rx="6"/>
    <rect x="600" y="310" width="260" height="150" rx="6"/>
  </g>

  <!-- Calles -->
  <rect x="0" y="220" width="900" height="60" fill="#FBF7F0"/>
  <rect x="265" y="0" width="34" height="500" fill="#FBF7F0"/>
  <rect x="565" y="0" width="34" height="500" fill="#FBF7F0"/>
  <line x1="0" y1="250" x2="900" y2="250" stroke="#D4A24C" stroke-width="4"
        stroke-dasharray="18 14"/>

  <!-- Nombres de calle -->
  <text x="60" y="212" font-family="Arial, sans-serif" font-size="18" fill="#5B5350">Av. Italia</text>
  <text x="278" y="486" font-family="Arial, sans-serif" font-size="15" fill="#5B5350"
        transform="rotate(-90 278 486)">Girardi</text>

  <!-- Marcador del restaurante -->
  <path d="M450 176 C420 176 398 199 398 228 C398 268 450 322 450 322
           C450 322 502 268 502 228 C502 199 480 176 450 176 Z" fill="#C1121F"/>
  <circle cx="450" cy="228" r="20" fill="#FBF7F0"/>
  <text x="450" y="360" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="20" fill="#1E1A17">Sabor de Barranco</text>
  <text x="450" y="386" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="16" fill="#5B5350">Av. Italia 1234, Providencia</text>

  <!-- Metro cercano -->
  <circle cx="140" cy="250" r="16" fill="#4A1E3D"/>
  <text x="140" y="256" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="16" fill="#FFFFFF">M</text>
  <text x="140" y="292" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="14" fill="#5B5350">Santa Isabel</text>
</svg>
