<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img">
  <defs>
    <linearGradient id="cielo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6D9A8"/>
      <stop offset="100%" stop-color="#EFC0A0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" fill="url(#cielo)"/>
  <circle cx="720" cy="120" r="58" fill="#F0A500" opacity="0.55"/>

  <!-- Cuerpo de la casona -->
  <rect x="120" y="150" width="660" height="380" fill="#F3E7D5"/>
  <rect x="120" y="150" width="660" height="380" fill="none" stroke="#D9CFC0" stroke-width="4"/>
  <polygon points="90,150 810,150 750,90 150,90" fill="#7A0B14"/>
  <rect x="120" y="500" width="660" height="30" fill="#C1121F" opacity="0.85"/>

  <!-- Toldo sobre la entrada -->
  <path d="M330 250 L570 250 L590 300 L310 300 Z" fill="#C1121F"/>
  <path d="M310 300 L590 300 L580 316 L320 316 Z" fill="#F0A500"/>

  <!-- Puerta y ventanas -->
  <rect x="390" y="330" width="120" height="200" rx="6" fill="#4A1E3D"/>
  <circle cx="480" cy="430" r="6" fill="#D4A24C"/>
  <rect x="180" y="330" width="140" height="130" rx="6" fill="#B9D6DE"/>
  <rect x="580" y="330" width="140" height="130" rx="6" fill="#B9D6DE"/>
  <rect x="180" y="330" width="140" height="130" rx="6" fill="none" stroke="#D9CFC0" stroke-width="6"/>
  <rect x="580" y="330" width="140" height="130" rx="6" fill="none" stroke="#D9CFC0" stroke-width="6"/>

  <!-- Letrero -->
  <rect x="330" y="185" width="240" height="46" rx="8" fill="#1E1A17"/>
  <text x="450" y="216" text-anchor="middle" font-family="Georgia, serif"
        font-size="22" fill="#F0A500">Sabor de Barranco</text>

  <!-- Maceteros del patio -->
  <rect x="250" y="470" width="54" height="60" rx="6" fill="#C97B3C"/>
  <circle cx="277" cy="452" r="34" fill="#4E8C4A"/>
  <rect x="600" y="470" width="54" height="60" rx="6" fill="#C97B3C"/>
  <circle cx="627" cy="452" r="34" fill="#3F7A3C"/>
</svg>
